group:
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mcodec
      halotukozak-com/mrpc
      halotukozak-com/regex
      halotukozak-com/alpaca
    files:
      - source: .scalafmt.conf
        dest: .scalafmt.conf
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mcodec
      halotukozak-com/mrpc
      halotukozak-com/regex
      halotukozak-com/alpaca
    files:
      - source: renovate.json
        dest: renovate.json
  # release.yml (GitHub's auto-generated release notes config): drops the
  # sync bot's own "🔄 synced file(s)" PRs from the "What's Changed" list —
  # they carry a `sync` label already, added by BetaHuhn to every PR it
  # opens (this file just teaches GitHub's own release-notes generator to
  # act on that label).
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mcodec
      halotukozak-com/mrpc
      halotukozak-com/regex
      halotukozak-com/alpaca
    files:
      - source: release.yml
        dest: .github/release.yml
  # ci.yml — the scala-cli repos. Job structure matches their branch
  # protection (Scalafmt/Test/Test (scala-js)/Test (scala-native)).
  # mrpc used to be excluded too (branch protection required a single
  # "Build and test" check) but was aligned to the shared job names —
  # see halotukozak-com/mrpc#51.
  # regex, alpaca, mcodec build with Mill and get shared/ci-mill.yml instead
  # (below) — mcodec migrated off scala-cli to stop losing its local
  # --exclude benchmark customization on every sync (halotukozak-com/mcodec#65).
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mrpc
    files:
      - source: shared/ci.yml
        dest: .github/workflows/ci.yml
  # The Mill repos (regex, alpaca, mcodec):
  # - ci-mill.yml: the `discover` job asks Mill which top-level modules have
  #   a `.test` submodule, so the `test` matrix works whether or not a repo
  #   has a Scala.js module, with no per-repo templating. Lands as tests.yml.
  # - bin-compat-check.scala + mima-mill.yml: same report-only MiMa setup as
  #   the scala-cli repos below, adapted for Mill's JAR/classpath resolution
  #   (`./mill show jvm.jar` / `jvm.compileClasspath` instead of
  #   `scala-cli package --library`); the check script itself is identical.
  # - publish-mill.yml: fully generic, no per-repo templating needed at all.
  # Each repo keeps its own unsynced docs workflow (Mill's build.mill drives
  # that) and regex additionally its own benchmark.yml. mcodec's benchmark/
  # module has no CI by design (comparative numbers are too noisy on a
  # shared runner) — see benchmark/README.md there.
  - repos: |
      halotukozak-com/regex
      halotukozak-com/alpaca
      halotukozak-com/mcodec
    files:
      - source: shared/ci-mill.yml
        dest: .github/workflows/tests.yml
      - source: .mima/bin-compat-check.scala
        dest: .mima/bin-compat-check.scala
      - source: shared/mima-mill.yml
        dest: .github/workflows/mima.yml
      - source: shared/publish-mill.yml
        dest: .github/workflows/publish.yml
  # docs.yaml is fully generic — project name/social-link/source-link are
  # derived from `github.event.repository.name` at runtime, so it's
  # byte-identical across repos with no per-repo templating needed.
  # regex, alpaca, mcodec are excluded: they generate docs via Mill
  # (build.mill's scalaDocOptions) from their own docs workflow.
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mrpc
    files:
      - source: shared/docs.yaml
        dest: .github/workflows/docs.yaml
  # MiMa binary-compatibility check, report-only (labels needs-major, never
  # fails the build). scala-cli repos — regex, alpaca, mcodec get the
  # Mill-adapted version of both files through the group above instead.
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mrpc
    files:
      - source: .mima/bin-compat-check.scala
        dest: .mima/bin-compat-check.scala
      - source: shared/mima.yml
        dest: .github/workflows/mima.yml
