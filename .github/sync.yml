group:
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mcodec
      halotukozak-com/mrpc
      halotukozak-com/regex
      halotukozak-com/alpaca
    files:
      - source: .scalafmt.conf
        dest: .scalafmt.conf
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mcodec
      halotukozak-com/mrpc
      halotukozak-com/regex
      halotukozak-com/alpaca
    files:
      - source: renovate.json
        dest: renovate.json
  # ci.yml is synced only where the job structure already matches
  # (Scalafmt/Test/Test (scala-js)/Test (scala-native) required checks):
  # - regex excludes bench/**+scripts/** (JMH benchmarks added via a
  #   separate --jmh run) and has its own benchmark job.
  # - mrpc's branch protection requires a single "Build and test" check,
  #   not the split Scalafmt/Test ones — syncing would permanently stall
  #   every PR there waiting on a check that no longer exists.
  # - alpaca builds with Mill entirely.
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mcodec
    files:
      - source: shared/ci.yml
        dest: .github/workflows/ci.yml
