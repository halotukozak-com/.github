group:
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mcodec
      halotukozak-com/mrpc
      halotukozak-com/regex
      halotukozak-com/alpaca
    files:
      - source: .scalafmt.conf
        dest: .scalafmt.conf
  - repos: |
      halotukozak-com/commons
      halotukozak-com/made
      halotukozak-com/mcodec
      halotukozak-com/mrpc
      halotukozak-com/regex
      halotukozak-com/alpaca
    files:
      - source: renovate.json
        dest: renovate.json
  # ci.yml is NOT synced: each repo's build/test steps are too specific to
  # share verbatim (e.g. regex excludes bench/**+scripts/** and has its own
  # JMH benchmark job; alpaca builds with Mill entirely). Every repo keeps
  # its own .github/workflows/ci.yml.
